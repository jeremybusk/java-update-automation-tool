# Organization policy for investigation, alignment, and migration.
# YAML is an input source of truth; generated stage artifacts are JSON.
schema_version: 1

targets:
  java:
    desired: 25
    acceptable: [21, 25]
  spring_boot:
    # Spring Boot 4.0 has a complete OpenRewrite migration recipe. Change this
    # after validating newer lines against your build plugins and platform BOMs.
    desired: "4.0.x"
    acceptable: ["3.5.x", "4.0.x"]

discovery:
  build_tool: auto
  max_depth: 5

alignment:
  dependencies:
    # Only dependencies present in two or more related repos are compared.
    include:
      - "org.springframework*:*"
      - "com.fasterxml.jackson*:*"
      - "org.junit*:*"
      - "org.mockito:*"
      - "org.apache.logging.log4j:*"
    exclude:
      - "org.springframework.boot:*" # governed by the Spring Boot target/BOM
    # Explicit pins remove ambiguity from generated plans. Add organization BOM
    # or contract-library coordinates here.
    pins: {}

migration:
  profile: standard
  verification:
    build: test
    postChecks: jdk
    strict: false
    commands: []
  openrewrite:
    # This recipe repository needs CODE_GENOME_USERNAME/CODE_GENOME_TOKEN.
    # Recipes are derived from targets; leave this empty unless adding overrides.
    # For Java-only migrations, clear artifacts and use maven-central.
    recipe_repository: codegenome
    recipes: []
    artifacts:
      - org.openrewrite.recipe:rewrite-migrate-java:3.45.0
      - org.openrewrite.recipe:rewrite-static-analysis:2.44.0
      - org.openrewrite.recipe:rewrite-java-dependencies:1.63.0
      - org.openrewrite.recipe:rewrite-testing-frameworks:3.47.0
      - org.openrewrite.recipe:rewrite-spring:6.40.0

# Global orchestration defaults. Full examples and exit codes: notes/workflow.md.
workflow:
  mode: manual                      # manual | unattended; CLI: --mode
  checkpoints:                      # Manual approval after these stages
    - 01-discovery
    - 02-assessment
    - 03-planning
    - 04-migration
    - 05-validation
    - 06-publishing
  source_selection: default        # default branch | current local checkout; --source-selection
  source_credentials: {}           # Intended source host: token ENV name (no token values)
  diagnostics:
    check_bytes: 10485760           # 10 MiB per check; truncation is reported
    run_bytes: 104857600            # 100 MiB diagnostic text per run
    retention_days: 30             # Logs expire independently of durable evidence
  retention:
    days: 30                       # Explicit prune eligibility; never automatic run deletion
    pins: []                       # Run IDs or externally referenced evidence paths
  show_diffs: false                 # Compare retained source/policy/output runs
  include_dependencies: false       # Expand selected depends_on recursively
  allow_dependency_override: false  # Manual experiments only; blocks publication
  dependency_evidence: {}           # repo_id: path/to/05-validation/.../result.json
  allow_downgrades: false           # Permit lower dependency pins; still validate

  validation:
    build: test                     # test | compile; publication also needs test evidence
    build_roots: []                 # Empty: all independent roots; explicit paths otherwise
    exclusions: {}                  # Excluded root path: non-empty reason
    test_exemptions: {}             # Suite name: non-empty reason (e.g. unit for testless BOM)
    suites: []                      # {name, command: [argv...], reports: [relative XML globs]}
    timeout: 3600                    # Seconds per build/inventory/custom command
    commands: []                    # Global checks, argv lists; never shell strings
    # commands: [["./scripts/contract-test.sh"], ["./scripts/integration-test.sh"]]
    repositories: {}                # Extra checks: repo_id: {commands: [["..."]]}

  publishing:
    enabled: false                  # Explicit opt-in for selected remote targets
    targets: [local_repo]           # local_repo, src_repo, dst_repo; any combination
    history: default                # default branch ancestry | all branches/tags
    independent_applications: false # Failed checks block the entire run by default
    provider: github                # github | gitlab (creation/default branch API)
    mode: autocreate                # autocreate stops on collisions | precreated
    owner: ""                       # GitHub account/org or GitLab namespace path
    prefix: ""                      # Set before autocreate, e.g. "java21-"
    default_branch: main            # Destination/local default, including master→main
    source_branch: "automation/java-{java}-{run_id}" # Unique per run; retry reuses it
    request:
      enabled: false                # Optional draft PR/MR after successful src_repo push
      base: null                    # Captured source default branch or explicit override
      links: []                     # Optional HTTPS CI/artifact evidence links
    source_default_branch: null     # Explicit host default rename; retains old branch
    private: true
    namespace_id: null              # Optional GitLab namespace ID
    api_url: null                   # Optional self-hosted API base URL, using HTTPS
    token_env: null                 # GH_TOKEN/GITLAB_TOKEN by default; values stay in env
    repositories: {}               # Per-repo overrides keyed by stable repo_id/name
    # repositories:
    #   orders-api:
    #     mode: precreated
    #     owner: acme
    #     name: orders-api-modern
    #   worker:
    #     mode: precreated
    #     url: git@github.com:acme/worker-modern.git
